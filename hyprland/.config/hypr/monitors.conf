# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale

# Optimized for retina-class 2x displays, like 13" 2.8K, 27" 5K, 32" 6K.
env = GDK_SCALE,2
monitor=,preferred,auto,auto

# Good compromise for 27" or 32" 4K monitors (but fractional!)
env = GDK_SCALE,1.75
monitor=,highrr,auto,1.6
 monitor=HDMI-A-1,disable

# Straight 1x setup for low-resolution displays like 1080p or 1440p
# env = GDK_SCALE,1
# monitor=,preferred,auto,1

# Example for Framework 13 w/ 6K XDR Apple display
# monitor = DP-5, 6016x3384@60, auto, 2
# monitor = eDP-1, 2880x1920@120, auto, 2
monitor = desc:ASUSTek COMPUTER INC PG32UCDM T7LMQV012624, highrr, 0x0, 1.6
monitor = desc:DRS Defense Solutions LLC TYPE-C L56051794302, preferred, 2400x710, 1

# Dedicated workspace for the tiny display, out of the numbered pool
workspace = name:mini, monitor:desc:DRS Defense Solutions LLC TYPE-C L56051794302, default:true, persistent:true

# Numbered workspaces stay on the main monitor
workspace = 1, monitor:desc:ASUSTek COMPUTER INC PG32UCDM T7LMQV012624
workspace = 2, monitor:desc:ASUSTek COMPUTER INC PG32UCDM T7LMQV012624
workspace = 3, monitor:desc:ASUSTek COMPUTER INC PG32UCDM T7LMQV012624
workspace = 4, monitor:desc:ASUSTek COMPUTER INC PG32UCDM T7LMQV012624
workspace = 5, monitor:desc:ASUSTek COMPUTER INC PG32UCDM T7LMQV012624
workspace = 6, monitor:desc:ASUSTek COMPUTER INC PG32UCDM T7LMQV012624
workspace = 7, monitor:desc:ASUSTek COMPUTER INC PG32UCDM T7LMQV012624
workspace = 8, monitor:desc:ASUSTek COMPUTER INC PG32UCDM T7LMQV012624
workspace = 9, monitor:desc:ASUSTek COMPUTER INC PG32UCDM T7LMQV012624
workspace = 10, monitor:desc:ASUSTek COMPUTER INC PG32UCDM T7LMQV012624
